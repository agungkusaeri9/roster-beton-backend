# version: "3.8"  # Obsolete in newer docker-compose versions

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: go-arch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-go_arch}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - go-arch-network

  # Go Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-arch-app
    restart: unless-stopped
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-go_arch}
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      TOKEN_EXPIRY: ${TOKEN_EXPIRY:-24h}
      # Server Configuration
      PORT: ${PORT:-1234}
      GIN_MODE: ${GIN_MODE:-release}
    ports:
      - "${PORT:-1234}:1234"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - go-arch-network
    healthcheck:
      test:
        ["CMD", "sh", "-c", "curl -f http://localhost:$$PORT/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Migration Service - runs automatically before app starts
  migrate:
    image: migrate/migrate:latest
    container_name: go-arch-migrate
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-go_arch}?sslmode=disable"
      - "up"
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - go-arch-network
    restart: "no"

volumes:
  postgres_data:
    driver: local

networks:
  go-arch-network:
    driver: bridge
